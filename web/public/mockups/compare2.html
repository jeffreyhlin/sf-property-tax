<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Compare (map tool)</title>
<style>
  /* ============================================================
     COMPARE — a tool layered over the map.
       1. tool on  -> every parcel becomes a toggle
       2. add by tapping the map or searching an address (2..6)
       3. press Compare -> report in a side panel (bottom sheet on phones)
       4. expand to full screen for room

     Each item carries its full recorded-deed chain. The top of the
     panel is a generated REPORT, not a blurb: spread, per-item
     mechanism, then the notable records.

     Copy follows petergyang/no-ai-slop: no binary contrasts, no
     colon reveals, no dramatic fragments, no closing aphorism,
     concrete numbers, active voice, em dashes avoided.
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --paper:#f7f3ea; --panel:#fffdf8; --ink:#2c2418; --ink-soft:#5c5344;
    --accent:#b25007; --line:#e7dfcd; --good:#5c7a4a; --shadow:0 8px 30px #2c241820;
    --tray-h: 76px;
  }
  html, body { height: 100%; }
  body {
    font: 15px/1.55 -apple-system, "Helvetica Neue", Segoe UI, sans-serif;
    color: var(--ink); background: var(--paper);
    overflow: hidden; -webkit-text-size-adjust: 100%;
  }

  /* ---------------- faux map ---------------- */
  .map { position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background: radial-gradient(900px 600px at 60% 45%, #f0c98f55, transparent 60%), var(--paper); }
  .map::before { content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg,#2c241809 0 1px,transparent 1px 46px),
                      repeating-linear-gradient(0deg,#2c241809 0 1px,transparent 1px 34px); }
  .blob { position:absolute; border-radius:3px; }

  /* clickable parcels — compare mode makes these toggles */
  .parcel { position:absolute; border-radius:4px; cursor:pointer;
    box-shadow: inset 0 0 0 1px #ffffff40; transition: transform .14s ease, box-shadow .14s ease; }
  .parcel::after { /* generous touch target on phones */
    content:""; position:absolute; inset:-12px; }
  .parcel:hover { transform: scale(1.09); }
  .parcel.sel { box-shadow: 0 0 0 3px var(--accent), var(--shadow); transform: scale(1.06); }
  .parcel .tick { position:absolute; inset:0; display:grid; place-items:center;
    color:#fff; font-size:13px; font-weight:800; opacity:0; text-shadow:0 1px 2px #0006; }
  .parcel.sel .tick { opacity:1; }
  .parcel .tag { position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
    margin-bottom:7px; background:#2c2418f0; color:#fff; font-size:11px; white-space:nowrap;
    padding:4px 8px; border-radius:6px; opacity:0; transition:opacity .14s ease; pointer-events:none; }
  .parcel:hover .tag { opacity:1; }

  /* ---------------- tool tray ---------------- */
  .tray { position: fixed; left:50%; bottom:0; transform: translateX(-50%); z-index:20;
    width: min(94vw, 880px); margin-bottom: max(18px, env(safe-area-inset-bottom));
    background: var(--panel); border:1px solid var(--line); border-radius:15px; box-shadow: var(--shadow);
    padding:11px 12px; display:flex; align-items:center; gap:12px; }
  .mode { display:flex; align-items:center; gap:7px; font-weight:650; font-size:12.5px;
    color:var(--accent); white-space:nowrap; }
  .mode .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); animation:pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .search { position:relative; flex:1 1 190px; min-width:120px; }
  .search input { width:100%; font:inherit; font-size:14px; padding:11px 12px 11px 34px;
    border:1px solid var(--line); border-radius:10px; background:var(--paper); outline:none; color:var(--ink); }
  .search input:focus { border-color:var(--accent); background:#fff; }
  .search .ico { position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45; }
  .suggest { position:absolute; bottom:calc(100% + 7px); left:0; right:0; background:var(--panel);
    border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow); overflow:hidden; display:none; }
  .suggest.open { display:block; }
  .suggest button { display:flex; justify-content:space-between; gap:10px; width:100%; font:inherit;
    text-align:left; padding:11px 13px; border:0; background:none; cursor:pointer; color:var(--ink); }
  .suggest button:hover { background:#f3ecdc; }
  .suggest .t { font-size:11.5px; color:var(--ink-soft); }

  .chips { display:flex; gap:6px; overflow-x:auto; max-width:min(46vw, 380px); scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; background:var(--paper);
    border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 11px; white-space:nowrap; }
  .chip .sw { width:9px; height:9px; border-radius:2px; flex:0 0 auto; }
  .chip .x { border:0; background:#eee5d2; border-radius:50%; width:20px; height:20px; min-width:20px;
    cursor:pointer; color:var(--ink-soft); font-size:12px; line-height:1; }
  .chip .x:hover { background:var(--accent); color:#fff; }

  .go { font:inherit; font-weight:650; font-size:14px; border:0; border-radius:10px; padding:12px 17px;
    background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; min-height:44px; }
  .go:disabled { background:#e4dac6; color:#a59b88; cursor:not-allowed; }
  .exit { border:0; background:none; color:var(--ink-soft); font-size:20px; cursor:pointer;
    padding:0 6px; min-width:34px; min-height:34px; }
  .count { font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }

  .hintbar { position:fixed; left:50%; transform:translateX(-50%); z-index:19;
    bottom: calc(var(--tray-h) + 12px);
    font-size:12px; color:var(--ink-soft); background:#fffdf8d9; border:1px solid var(--line);
    padding:6px 13px; border-radius:999px; backdrop-filter:blur(4px); white-space:nowrap; }

  /* ---------------- result panel ---------------- */
  .result { position:fixed; z-index:30; background:var(--panel); overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    transition: transform .34s cubic-bezier(.3,.7,.2,1), width .3s ease, height .3s ease; }
  .result.dock { top:0; right:0; width:456px; height:100dvh; border-left:1px solid var(--line);
    box-shadow:-12px 0 40px #2c241818; }
  .result.full { top:0; right:0; left:0; width:100vw; height:100dvh; background:var(--paper); box-shadow:none; }
  .result.hidden { transform: translateX(103%); pointer-events:none; }

  .rhead { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:10px;
    padding:13px 16px; background:#fffdf8f5; backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .result.full .rhead { background:#f7f3eaf5; }
  .rhead h2 { font-size:14.5px; font-weight:700; }
  .seg { margin-left:auto; display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { font:inherit; font-size:12.5px; border:0; background:var(--panel); padding:8px 12px;
    cursor:pointer; color:var(--ink-soft); min-height:36px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .rhead .x { border:0; background:#f3ecdc; border-radius:8px; width:34px; height:34px; cursor:pointer;
    font-size:16px; color:var(--ink-soft); }
  .grab { display:none; }

  .wrap { padding:0 16px 44px; }
  .result.full .wrap { max-width:1180px; margin:0 auto; padding:0 22px 48px; }

  /* ---------------- the generated report ---------------- */
  .report { margin:16px 0 6px; }
  .report .meta { font-size:11px; letter-spacing:.11em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:700; margin-bottom:10px; }
  .lede { font-size:17px; line-height:1.45; color:var(--ink); margin-bottom:4px; }
  .lede b { font-weight:700; }
  .sec { margin-top:18px; }
  .sec h4 { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
    font-weight:700; margin-bottom:8px; }
  .sec p { color:var(--ink-soft); margin-bottom:9px; }
  .sec p b, .sec li b { color:var(--ink); font-weight:650; }
  .why { list-style:none; display:flex; flex-direction:column; gap:9px; }
  .why li { display:flex; gap:9px; align-items:flex-start; font-size:14px; color:var(--ink-soft); line-height:1.45; }
  .why .sw { width:10px; height:10px; border-radius:2px; margin-top:6px; flex:0 0 auto; }

  /* ---------------- metric table ---------------- */
  .tablewrap { overflow-x:auto; margin-top:8px; -webkit-overflow-scrolling:touch; }
  table.metrics { border-collapse:collapse; width:100%; min-width:min-content; }
  table.metrics th, table.metrics td { text-align:left; padding:10px 10px 10px 0;
    border-top:1px solid var(--line); font-variant-numeric:tabular-nums; vertical-align:top;
    white-space:nowrap; }
  table.metrics thead th { border:0; padding-top:0; }
  .rowlab { font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft);
    font-weight:700; padding-right:14px !important; }
  table.metrics td.best { color:var(--good); font-weight:700; }
  table.metrics td.worst { color:var(--accent); font-weight:700; }
  .colhead { font-weight:700; font-size:13px; padding-right:14px !important; }
  .colhead .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
  .colhead small { display:block; font-weight:400; color:var(--ink-soft); font-size:11px; }
  .meter { height:5px; background:#eee5d2; border-radius:3px; margin-top:5px; overflow:hidden; min-width:70px; }
  .meter i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),#e8a35c); }

  /* ---------------- deed chains ---------------- */
  details.deeds { border-top:1px solid var(--line); }
  details.deeds summary { list-style:none; cursor:pointer; padding:12px 0; display:flex;
    align-items:center; gap:8px; font-weight:650; font-size:13.5px; }
  details.deeds summary::-webkit-details-marker { display:none; }
  details.deeds summary .sw { width:10px; height:10px; border-radius:2px; }
  details.deeds summary .n { margin-left:auto; font-weight:400; font-size:11.5px; color:var(--ink-soft); }
  details.deeds summary .caret { color:var(--ink-soft); font-size:10px; transition:transform .2s; }
  details.deeds[open] summary .caret { transform:rotate(90deg); }
  .deedrow { display:flex; gap:10px; padding:6px 0 7px; border-top:1px solid #f2ebda; font-size:12.5px; }
  .deedrow .yr { flex:0 0 36px; font-weight:650; }
  .deedrow .d { color:var(--ink-soft); line-height:1.45; }
  .deedrow .d b { color:var(--ink); font-weight:600; }
  .pill { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:2px 5px; border-radius:4px; margin-left:5px; white-space:nowrap; }
  .p-market { color:#4d6b3c; background:#eaf0e2; }
  .p-family { color:var(--accent); background:#f7e3d2; }
  .p-basis  { color:#fff; background:var(--accent); }

  /* ---------------- full-screen columns ---------------- */
  .cols { display:flex; gap:16px; align-items:flex-start; overflow-x:auto; padding:8px 0 22px;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }
  .col { flex:0 0 300px; background:var(--panel); border:1px solid var(--line); border-radius:15px;
    box-shadow:0 4px 18px #2c24180d; padding:16px; scroll-snap-align:start; }
  .col .swatch { height:52px; border-radius:9px; margin-bottom:12px; }
  .col h3 { font-size:15px; } .col .sub { font-size:11.5px; color:var(--ink-soft); }
  .col .big { font-size:23px; font-weight:800; color:var(--accent); margin:11px 0 1px; }
  .col .big small { display:block; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); font-weight:650; }
  .specrow { display:flex; justify-content:space-between; gap:12px; padding:7px 0;
    border-top:1px solid #f2ebda; font-size:13px; font-variant-numeric:tabular-nums; }
  .specrow .k { color:var(--ink-soft); font-size:11.5px; }

  /* ============ MOBILE ============ */
  @media (max-width: 760px) {
    :root { --tray-h: 128px; }
    body { font-size: 15px; }

    /* tray becomes a stacked bottom bar */
    .tray { width:100%; left:0; transform:none; margin:0; border-radius:16px 16px 0 0;
      border-left:0; border-right:0; border-bottom:0; flex-wrap:wrap; gap:9px;
      padding:11px 12px calc(11px + env(safe-area-inset-bottom)); }
    .mode { order:1; }
    .count { order:2; margin-left:auto; }
    .exit { order:3; }
    .search { order:4; flex:1 1 100%; min-width:0; }
    .chips { order:5; flex:1 1 100%; max-width:100%; padding-bottom:2px; }
    .go { order:6; flex:1 1 100%; }
    .hintbar { font-size:11.5px; max-width:92vw; white-space:normal; text-align:center; }

    /* dock becomes a bottom sheet */
    .result.dock { top:auto; bottom:0; left:0; right:0; width:100%; height:88dvh;
      border-left:0; border-top:1px solid var(--line); border-radius:18px 18px 0 0;
      box-shadow:0 -12px 40px #2c241822; }
    .result.dock.hidden { transform: translateY(103%); }
    .result.full.hidden { transform: translateY(103%); }
    .result.dock .grab { display:block; width:38px; height:4px; border-radius:99px;
      background:#ddd3bd; margin:8px auto 0; }
    .wrap, .result.full .wrap { padding-left:14px; padding-right:14px; }
    .lede { font-size:16px; }

    /* one card per screen, swipeable */
    .col { flex:0 0 86vw; }
    .rhead { padding:11px 14px; }
    .seg button { padding:8px 10px; font-size:12px; }
  }
  @media (max-width: 380px) { .seg button { padding:8px 8px; } }
</style>
</head>
<body>

  <div class="map" id="map"></div>
  <div class="hintbar" id="hintbar">Compare mode on. Tap parcels to add or remove them.</div>

  <div class="tray" id="tray">
    <span class="mode"><span class="dot"></span> Compare</span>
    <span class="count" id="count"></span>
    <button class="exit" id="exit" title="Leave compare mode">&times;</button>
    <div class="search">
      <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2c2418" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
      <input id="q" placeholder="Add an address or neighborhood" autocomplete="off" />
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="chips" id="chips"></div>
    <button class="go" id="go">Compare</button>
  </div>

  <div class="result dock hidden" id="result">
    <div class="grab"></div>
    <div class="rhead">
      <h2>Comparison</h2>
      <div class="seg">
        <button id="segDock" class="on">Panel</button>
        <button id="segFull">Full screen</button>
      </div>
      <button class="x" id="closeResult">&times;</button>
    </div>
    <div id="body"></div>
  </div>

<script>
  const MAX_ITEMS = 6;

  /* -------- data: real parcels, real recorded chains -------- */
  const DATA = {
    lansdale: { name:'247 Lansdale Ave', short:'247 Lansdale', kind:'SFH', where:'West of Twin Peaks', nbhd:'West of Twin Peaks',
      color:'#b25007', street:'Lansdale', assessed:2.28e6, est:7.79e6, ratio:.29,
      tax:26921, newBuyer:91953, savings:65032, basisYear:2011, basisHow:'a developer sale',
      deeds:[
        {y:2020, t:'Reconveyance', g:'Unionbancal Mortgage Corp', e:'Powell Jennifer Lynne', k:'other'},
        {y:2011, t:'Deed', g:'James Bong Enterprise Inc', e:'Powell Jennifer Lynne', k:'market', basis:true},
        {y:2004, t:"Mechanic's Lien", g:'James Bong Enterprise Inc', e:'Granite Excavation', k:'other'},
        {y:1992, t:'Deed', g:'Pinto Pedro & Alicia', e:'Toboni Joseph & Mary D', k:'market'},
      ]},
    neighbor: { name:'251 Lansdale Ave', short:'251 Lansdale', kind:'SFH', where:'next door', nbhd:'West of Twin Peaks',
      color:'#e8a35c', street:'Lansdale', assessed:6.85e6, est:8.42e6, ratio:.81,
      tax:71200, newBuyer:87900, savings:16700, basisYear:2021, basisHow:'a market sale',
      deeds:[
        {y:2021, t:'Deed', g:'Alvarez Maria R', e:'Chen Wei & Li Ann', k:'market', basis:true},
        {y:2021, t:'Deed of Trust', g:'Chen Wei & Li Ann', e:'Wells Fargo Bank NA', k:'other'},
        {y:2004, t:'Deed', g:'Okamoto Ruth T', e:'Alvarez Maria R', k:'market'},
      ]},
    pacific: { name:'1905 Pacific Ave', short:'1905 Pacific', kind:'SFH', where:'Pacific Heights', nbhd:'Pacific Heights',
      color:'#9a4506', street:'Pacific', assessed:.25e6, est:7.02e6, ratio:.035,
      tax:2900, newBuyer:82800, savings:79914, basisYear:2015, basisHow:'a father-to-son transfer',
      family:true, familyDetail:'Rosenak Theodore W to Rosenak Max William in June 2015, one month after Theodore bought it from Blasko Peter P at market',
      deeds:[
        {y:2018, t:'Deed', g:'Rosenak Max William', e:'Rosenak Max William', k:'family'},
        {y:2015, t:'Deed', g:'Rosenak Theodore W', e:'Rosenak Max William', k:'family', basis:true},
        {y:2015, t:'Deed', g:'Blasko Peter P', e:'Rosenak Theodore W', k:'market'},
      ]},
    fell: { name:'375 Fell St', short:'375 Fell', kind:'Multi', where:'Hayes Valley', nbhd:'Hayes Valley',
      color:'#c96a1f', street:'Fell', assessed:3.1e6, est:31.4e6, ratio:.099,
      tax:36600, newBuyer:358100, savings:321493, basisYear:2011, basisHow:'a housing-partnership transfer',
      institutional:true,
      deeds:[
        {y:2011, t:'Deed', g:'0832/069', e:'Gough Street Housing Assocs LP', k:'market', basis:true},
        {y:2009, t:'Deed of Trust', g:'Gough Street Housing Assocs LP', e:'Citibank NA', k:'other'},
      ]},
    sunset: { name:'Sunset/Parkside', short:'Sunset', kind:'Neighborhood', where:'22,041 parcels', nbhd:'Sunset/Parkside',
      color:'#b25007', assessed:null, est:null, ratio:.38,
      tax:9100, newBuyer:24000, savings:14900, basisYear:null, basisHow:'decades of unchanged ownership',
      aggregate:true, deeds:null },
    noe: { name:'Noe Valley', short:'Noe Valley', kind:'Neighborhood', where:'5,214 parcels', nbhd:'Noe Valley',
      color:'#d98a4b', assessed:null, est:null, ratio:.44,
      tax:14900, newBuyer:33900, savings:19000, basisYear:null, basisHow:'long-held Victorians',
      aggregate:true, deeds:null },
  };

  const $ = s => document.querySelector(s);
  const money = n => '$' + Math.round(n).toLocaleString();
  const mil = n => '$' + (n/1e6).toFixed(n < 1e6 ? 2 : 1) + 'M';
  const pct = r => Math.round(r*100) + '%';

  let picked = ['pacific', 'lansdale', 'neighbor'];  // 3 is the typical case
  let view = 'dock';

  /* ---------------- selection ---------------- */
  const q = $('#q'), suggest = $('#suggest');
  q.addEventListener('input', () => {
    const v = q.value.trim().toLowerCase();
    if (!v) return suggest.classList.remove('open');
    const hits = Object.entries(DATA).filter(([id,d]) => !picked.includes(id) && d.name.toLowerCase().includes(v));
    suggest.innerHTML = hits.length
      ? hits.map(([id,d]) => `<button data-id="${id}"><span>${d.name}</span><span class="t">${d.kind}</span></button>`).join('')
      : `<button disabled style="color:#8a8070">No match in this mock</button>`;
    suggest.classList.add('open');
  });
  suggest.addEventListener('click', e => { const id = e.target.closest('button')?.dataset.id; if (id) add(id); });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) suggest.classList.remove('open'); });

  function add(id) {
    if (picked.includes(id)) return;
    if (picked.length >= MAX_ITEMS) { flashHint(`Six is the maximum. Remove one to add another.`); return; }
    picked.push(id); q.value = ''; suggest.classList.remove('open'); sync();
  }
  function remove(id) { picked = picked.filter(p => p !== id); sync(); }
  window.remove = remove;

  let hintTimer;
  function flashHint(msg) {
    const h = $('#hintbar'); const prev = h.textContent;
    h.textContent = msg; clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { h.textContent = 'Compare mode on. Tap parcels to add or remove them.'; }, 2600);
  }

  function sync() {
    $('#chips').innerHTML = picked.map(id => {
      const d = DATA[id];
      return `<span class="chip"><span class="sw" style="background:${d.color}"></span>${d.short}
        <button class="x" onclick="remove('${id}')" aria-label="Remove ${d.short}">&times;</button></span>`;
    }).join('');
    $('#count').textContent = `${picked.length} of ${MAX_ITEMS}`;
    const go = $('#go');
    go.disabled = picked.length < 2;
    go.textContent = picked.length >= 2 ? `Compare ${picked.length}` : 'Pick two or more';
    document.querySelectorAll('.parcel').forEach(el => {
      const on = picked.includes(el.dataset.id);
      el.classList.toggle('sel', on);
      el.querySelector('.tag').textContent = `${DATA[el.dataset.id].name}, tap to ${on ? 'remove' : 'add'}`;
    });
    if (!$('#result').classList.contains('hidden')) render();
  }

  $('#go').addEventListener('click', () => { $('#result').classList.remove('hidden'); render(); });
  $('#closeResult').addEventListener('click', () => $('#result').classList.add('hidden'));
  $('#exit').addEventListener('click', () => flashHint('This would return you to the free map.'));
  $('#segDock').addEventListener('click', () => setView('dock'));
  $('#segFull').addEventListener('click', () => setView('full'));
  function setView(v) {
    view = v;
    const r = $('#result');
    r.classList.toggle('dock', v==='dock'); r.classList.toggle('full', v==='full');
    $('#segDock').classList.toggle('on', v==='dock'); $('#segFull').classList.toggle('on', v==='full');
    render();
  }

  /* ================= the report =================
     Structured generation: a lede carrying the spread, a per-item
     mechanism list, then whatever the records make notable.
     Written to avoid the no-ai-slop patterns.               */
  function buildReport(items) {
    const byS = [...items].sort((a,b) => b.savings - a.savings);
    const top = byS[0], bot = byS[byS.length-1];
    const gap = top.savings - bot.savings;
    const places = [...new Set(items.map(i => i.nbhd || i.name))].slice(0,3);

    // a median across a neighborhood is not one household's bill, so say so
    const subj = (i, lead) => i.aggregate
      ? `${lead ? 'The median home in ' : 'the median in '}<b>${i.name}</b>`
      : `<b>${i.name}</b>`;

    // lede: the spread, in money, with the value context when we have it
    let lede = `${subj(top, true)} keeps <b>${money(top.savings)} a year</b> that a new buyer would owe. `
             + `${subj(bot, false).replace(/^the /,'The ')} keeps ${money(bot.savings)}. `;
    // the "similar value" clause only holds when the estimates are close, otherwise
    // it invites the wrong inference, so state the difference plainly instead
    const comparable = top.est && bot.est && Math.max(top.est,bot.est) / Math.min(top.est,bot.est) <= 1.8;
    if (comparable) {
      lede += `The ${money(gap)} difference sits between two properties this model values within `
            + `${mil(Math.abs(top.est - bot.est))} of each other, ${mil(top.est)} and ${mil(bot.est)}.`;
    } else {
      lede += `That is a ${money(gap)} annual difference.`;
    }

    // per-item mechanism
    const why = byS.map(i => {
      const when = i.basisYear ? `Basis set in <b>${i.basisYear}</b> by ${i.basisHow}.`
                               : `No reset on record since 2007, carried by ${i.basisHow}.`;
      return `<li><span class="sw" style="background:${i.color}"></span><span><b>${i.name}.</b> ${when} `
           + `Taxed at ${pct(i.ratio)} of estimated value, ${money(i.tax)} against ${money(i.newBuyer)} for a new buyer.</span></li>`;
    }).join('');

    // notable: only claims the records support
    const notes = [];
    const fam = items.filter(i => i.family);
    if (fam.length === 1) {
      notes.push(`<b>${fam[0].name}</b> is the only property here whose basis came from a family transfer. `
               + `The recorder shows ${fam[0].familyDetail}.`);
    } else if (fam.length > 1) {
      notes.push(`${fam.length} of these carry a basis set by a family transfer: ${fam.map(f=>f.name).join(', ')}.`);
    }
    const inst = items.filter(i => i.institutional);
    if (inst.length) {
      notes.push(`<b>${inst[0].name}</b> is held by a housing partnership. Its low assessment reflects `
               + `regulatory restrictions rather than a Prop 13 carryover, so it does not belong in the same category as the homes.`);
    }
    // same-street pairs
    const streets = {};
    items.forEach(i => { if (i.street) (streets[i.street] ||= []).push(i); });
    Object.values(streets).filter(g => g.length > 1).forEach(g => {
      const a = g.reduce((m,x) => x.savings > m.savings ? x : m, g[0]);
      const b = g.reduce((m,x) => x.savings < m.savings ? x : m, g[0]);
      notes.push(`${a.name} and ${b.name} are on the same street and ${money(a.savings-b.savings)} a year apart.`);
    });
    const agg = items.filter(i => i.aggregate);
    if (agg.length) {
      notes.push(`${agg.map(a=>a.name).join(' and ')} ${agg.length>1?'are medians':'is a median'} across `
               + `${agg.map(a=>a.where).join(' and ')}, so ${agg.length>1?'they set':'it sets'} context rather than a like-for-like row.`);
    }

    return { lede, why, notes, count: items.length, places };
  }

  function reportHTML(items) {
    const r = buildReport(items);
    return `<div class="report">
      <div class="meta">Comparison report · ${r.count} selected · ${r.places.join(' · ')}</div>
      <p class="lede">${r.lede}</p>
      <div class="sec"><h4>Why each pays what it pays</h4><ul class="why">${r.why}</ul></div>
      ${r.notes.length ? `<div class="sec"><h4>From the records</h4>${r.notes.map(n=>`<p>${n}</p>`).join('')}</div>` : ''}
    </div>`;
  }

  /* ---------------- deed chains ---------------- */
  function pillFor(x) {
    let s = '';
    if (x.k === 'market') s += `<span class="pill p-market">transfer</span>`;
    if (x.k === 'family') s += `<span class="pill p-family">family</span>`;
    if (x.basis) s += `<span class="pill p-basis">sets tax basis</span>`;
    return s;
  }
  function deedsHTML(d, openByDefault) {
    if (!d.deeds) return `<details class="deeds"><summary><span class="sw" style="background:${d.color}"></span>
      ${d.name}<span class="n">aggregate</span><span class="caret">▶</span></summary>
      <div class="deedrow"><span class="d">Neighborhood totals have no deed chain. Open a single parcel for its records.</span></div></details>`;
    return `<details class="deeds"${openByDefault ? ' open' : ''}>
      <summary><span class="sw" style="background:${d.color}"></span>${d.name}
        <span class="n">${d.deeds.length} records</span><span class="caret">▶</span></summary>
      ${d.deeds.map(x => `<div class="deedrow"><span class="yr">${x.y}</span>
        <span class="d"><b>${x.t}</b>${pillFor(x)}<br>${x.g} to ${x.e}</span></div>`).join('')}
    </details>`;
  }

  /* ---------------- render ---------------- */
  function render() {
    const items = picked.map(id => DATA[id]);
    if (items.length < 2) { $('#body').innerHTML = `<div class="wrap"><p class="sec">Pick two or more to build a report.</p></div>`; return; }
    const openDeeds = items.length <= 3;   // collapse chains once the list grows

    if (view === 'dock') {
      const rows = [
        ['Tax today',      i=>money(i.tax),           'low',  i=>i.tax],
        ['New buyer pays', i=>money(i.newBuyer),      null,   null],
        ['Saved per year', i=>money(i.savings),       'high', i=>i.savings],
        ['Share of value', i=>`${pct(i.ratio)}<div class="meter"><i style="width:${Math.min(100,i.ratio*100)}%"></i></div>`, 'low', i=>i.ratio],
        ['Basis set',      i=>i.basisYear ?? 'pre-2007', null, null],
      ];
      let t = `<div class="tablewrap"><table class="metrics"><thead><tr><th></th>`
        + items.map(i=>`<th class="colhead"><span class="sw" style="background:${i.color}"></span>${i.short}<small>${i.kind}</small></th>`).join('')
        + `</tr></thead><tbody>`;
      for (const [lab,get,dir,raw] of rows) {
        let b=-1,w=-1;
        if (dir && raw) {
          const n = items.map(raw);
          const bv = dir==='low'?Math.min(...n):Math.max(...n), wv = dir==='low'?Math.max(...n):Math.min(...n);
          b=n.indexOf(bv); w=n.indexOf(wv); if (b===w) { b=-1; w=-1; }
        }
        t += `<tr><td class="rowlab">${lab}</td>`
           + items.map((i,ix)=>`<td class="${ix===b?'best':''}${ix===w?' worst':''}">${get(i)}</td>`).join('') + `</tr>`;
      }
      t += `</tbody></table></div>`;
      $('#body').innerHTML = `<div class="wrap">${reportHTML(items)}
        <div class="sec"><h4>Side by side</h4>${t}</div>
        <div class="sec"><h4>Recorded documents</h4>${items.map(i=>deedsHTML(i, openDeeds)).join('')}</div></div>`;
    } else {
      const cols = items.map(i => `<div class="col">
        <div class="swatch" style="background:linear-gradient(135deg,${i.color},${i.color}aa)"></div>
        <h3>${i.name}</h3><div class="sub">${i.kind} · ${i.where}</div>
        <div class="big">${money(i.savings)}<small>saved per year</small></div>
        <div class="specrow"><span class="k">Assessed</span><span>${i.assessed?mil(i.assessed):'—'}</span></div>
        <div class="specrow"><span class="k">Est. market</span><span>${i.est?mil(i.est):'—'}</span></div>
        <div class="specrow"><span class="k">Tax today</span><span>${money(i.tax)}</span></div>
        <div class="specrow"><span class="k">New buyer pays</span><span>${money(i.newBuyer)}</span></div>
        <div class="specrow"><span class="k">Share of value</span><span>${pct(i.ratio)}</span></div>
        <div class="specrow"><span class="k">Basis set</span><span>${i.basisYear ?? 'pre-2007'}</span></div>
        ${deedsHTML(i, openDeeds)}
      </div>`).join('');
      $('#body').innerHTML = `<div class="wrap">${reportHTML(items)}<div class="cols">${cols}</div></div>`;
    }
  }

  /* ---------------- faux map ---------------- */
  const map = $('#map');
  const ramp = ['#b25007','#c96a1f','#d98a4b','#e8a35c','#f0c98f','#f5e3c0'];
  for (let i=0;i<110;i++) {
    const b = document.createElement('div'); b.className='blob';
    b.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;`
      + `width:${8+Math.random()*32}px;height:${7+Math.random()*20}px;`
      + `background:${ramp[Math.floor(Math.pow(Math.random(),1.6)*ramp.length)]};opacity:${.2+Math.random()*.42}`;
    map.appendChild(b);
  }
  const SPOTS = [
    { id:'lansdale', x:'24%', y:'56%', w:32, h:24 },
    { id:'neighbor', x:'29%', y:'56%', w:28, h:24 },
    { id:'pacific',  x:'62%', y:'31%', w:30, h:23 },
    { id:'fell',     x:'46%', y:'44%', w:36, h:20 },
    { id:'noe',      x:'38%', y:'70%', w:26, h:26 },
    { id:'sunset',   x:'12%', y:'40%', w:34, h:28 },
  ];
  SPOTS.forEach(s => {
    const d = DATA[s.id];
    const el = document.createElement('div');
    el.className = 'parcel'; el.dataset.id = s.id;
    el.style.cssText = `left:${s.x};top:${s.y};width:${s.w}px;height:${s.h}px;background:${d.color}`;
    el.innerHTML = `<span class="tick">✓</span><span class="tag"></span>`;
    el.addEventListener('click', () => picked.includes(s.id) ? remove(s.id) : add(s.id));
    map.appendChild(el);
  });

  /* keep the hint clear of the tray, whose height changes with the layout */
  function measureTray() {
    const h = $('#tray').getBoundingClientRect().height;
    document.documentElement.style.setProperty('--tray-h', h + 'px');
  }
  addEventListener('resize', measureTray);
  addEventListener('orientationchange', () => setTimeout(measureTray, 120));

  sync();
  measureTray();
</script>
</body>
</html>

# Everything here is relative to the repo root. Setting `base = "web"` instead
# would put the function outside it, and it also made `publish` resolve to
# web/web/dist — harmless only because deploys upload a prebuilt directory.
[build]
  command = "cd web && npm ci && npm run build"
  publish = "web/dist"

# On-demand deed lookups. The function imports the recorder client that the
# worker and the export scripts also use, so there is one implementation and
# three callers rather than three copies to keep in step.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["worker/recorder-api.mjs"]

# Data paths must 404 when a file is missing rather than fall through to the
# SPA catch-all below. Netlify serves real files first and only applies these
# when nothing matches, so an unseeded parcel returns a true 404 and the app
# renders its "not looked up yet" state instead of choking on HTML.
# These have to come BEFORE the catch-all, since rules match in order.
[[redirects]]
  from = "/records/*"
  to   = "/records/:splat"
  status = 404

[[redirects]]
  from = "/data/*"
  to   = "/data/:splat"
  status = 404

[[redirects]]
  from = "/audio/*"
  to   = "/audio/:splat"
  status = 404

# Single-page app: every other route renders index.html. Deep links like
# /#p=2992059 are hash-based so they never hit the server, but this keeps
# any future path-based route working.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Generated map data and deed records are content-addressed by a yearly roll
# rebuild rather than by filename hash, so cache them hard but let the HTML
# revalidate. Bump the roll and the deploy replaces them.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/records/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Narration is regenerated only when the script changes, and the manifest is
# what tells the app a take exists, so keep the manifest fresher than the MP3s.
[[headers]]
  for = "/audio/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/audio/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
